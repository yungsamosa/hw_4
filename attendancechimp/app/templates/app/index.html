<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AttendanceChimp</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 0;
            padding: 3em 1em;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AttendanceChimp</h1>

        <p>
            AttendanceChimp is an electronic class attendance tool. Instructors post a
            QR code for each lecture, and students photograph and upload it to be
            marked present.
        </p>

        <p>
            {% if is_logged_in %}
                <strong>{{ username }}</strong>
            {% else %}
                Not logged in.
            {% endif %}
        </p>

        <p>Current time (CST): {{ current_time }}</p>
    </div>
</body>
</html>
