<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sign Up - AttendanceChimp</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 0;
            padding: 3em 1em;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .field {
            margin-bottom: 1em;
        }
        label {
            display: block;
            margin-bottom: 0.25em;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.4em;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>

        <form action="/app/createUser" method="post">
            {% csrf_token %}

            <div class="field">
                <label for="user_name">User name</label>
                <input type="text" id="user_name" name="user_name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="field">
                <label>I am a</label>
                <input type="radio" id="is_student_yes" name="is_student" value="student" checked>
                <label for="is_student_yes" style="display: inline;">Student</label>
                <input type="radio" id="is_student_no" name="is_student" value="instructor">
                <label for="is_student_no" style="display: inline;">Instructor</label>
            </div>

            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
